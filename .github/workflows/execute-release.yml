name: Execute Release

on:
  workflow_run:
    workflows: ["Publish Dudley Bluefin"]
    types: [completed]
    branches: [testing]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run - verify gates but do not promote"
        type: boolean
        default: true

permissions:
  contents: read
  packages: read

jobs:
  disabled-until-stable-proven:
    runs-on: ubuntu-24.04
    steps:
      - name: Stop before stable promotion
        run: |
          echo "::error::Dudley Factory stable promotion is disabled until dudley-bluefin and dudley-bluefin-nvidia pass boot, update, rollback, and installer parity checks."
          echo "The active factory stream is ghcr.io/joshyorko/dudley-bluefin:testing."
          echo "Current dudley-os remains the production release path."
          exit 1
