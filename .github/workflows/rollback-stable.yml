name: Rollback Stable

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: "Published SHA tag to roll back to"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  disabled-until-stable-proven:
    runs-on: ubuntu-24.04
    steps:
      - name: Stop before stable rollback
        run: |
          echo "::error::Dudley Factory stable rollback is disabled until dudley-bluefin and dudley-bluefin-nvidia pass boot, update, rollback, and installer parity checks."
          echo "Requested target: ${{ inputs.target_sha }}"
          exit 1
