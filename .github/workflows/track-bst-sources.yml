name: Track BuildStream Sources

on:
  repository_dispatch:
    types: [common-updated, dsb-common-updated]
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      group:
        description: "Which source group to track"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - payload
          - bluefin
          - nvidia
          - core-junctions
      element:
        description: "Optional exact element path from the matrix"
        required: false
        type: string

permissions: read-all

concurrency:
  group: dudley-bluefin-bst-build-global
  cancel-in-progress: false

env:
  BST2_IMAGE: registry.gitlab.com/freedesktop-sdk/infrastructure/freedesktop-sdk-docker-images/bst2:64eb0b4930d57a92710822898fb73af6cc1ae35d
  BASE_BRANCH: main

jobs:
  track:
    name: Track ${{ matrix.element }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: payload
            element: dudley/dsb-common-payload.bst
            branch: patchraptor/track-dsb-common-payload
            title: "chore(deps): update dsb-common payload"
            dispatch: dsb-common-updated

          - group: bluefin
            element: bluefin/common.bst
            branch: patchraptor/track-bluefin-common
            title: "chore(deps): update Bluefin common payload"
            dispatch: common-updated
          - group: bluefin
            element: bluefin/brew.bst
            branch: patchraptor/track-brew
            title: "chore(deps): update brew"
          - group: bluefin
            element: bluefin/distrobox.bst
            branch: patchraptor/track-distrobox
            title: "chore(deps): update distrobox"
          - group: bluefin
            element: bluefin/efibootmgr.bst
            branch: patchraptor/track-efibootmgr
            title: "chore(deps): update efibootmgr"
          - group: bluefin
            element: bluefin/jetbrains-mono.bst
            branch: patchraptor/track-jetbrains-mono
            title: "chore(deps): update JetBrains Mono"
          - group: bluefin
            element: bluefin/nautilus-python.bst
            branch: patchraptor/track-nautilus-python
            title: "chore(deps): update nautilus-python"
          - group: bluefin
            element: bluefin/sudo-rs.bst
            branch: patchraptor/track-sudo-rs
            title: "chore(deps): update sudo-rs"
          - group: bluefin
            element: bluefin/uutils-coreutils.bst
            branch: patchraptor/track-uutils-coreutils
            title: "chore(deps): update uutils-coreutils"
          - group: bluefin
            element: bluefin/xdg-terminal-exec.bst
            branch: patchraptor/track-xdg-terminal-exec
            title: "chore(deps): update xdg-terminal-exec"
          - group: bluefin
            element: bluefin/shell-extensions/app-indicators.bst
            branch: patchraptor/track-app-indicators
            title: "chore(deps): update AppIndicator extension"
          - group: bluefin
            element: bluefin/shell-extensions/blur-my-shell.bst
            branch: patchraptor/track-blur-my-shell
            title: "chore(deps): update Blur My Shell extension"
          - group: bluefin
            element: bluefin/shell-extensions/caffeine.bst
            branch: patchraptor/track-caffeine
            title: "chore(deps): update Caffeine extension"
          - group: bluefin
            element: bluefin/shell-extensions/custom-command-menu.bst
            branch: patchraptor/track-custom-command-menu
            title: "chore(deps): update custom command menu extension"
          - group: bluefin
            element: bluefin/shell-extensions/dash-to-dock.bst
            branch: patchraptor/track-dash-to-dock
            title: "chore(deps): update Dash to Dock extension"
          - group: bluefin
            element: bluefin/shell-extensions/gsconnect.bst
            branch: patchraptor/track-gsconnect
            title: "chore(deps): update GSConnect extension"

          - group: nvidia
            element: bluefin-nvidia/egl-external-platform.bst
            branch: patchraptor/track-nvidia-egl-external-platform
            title: "chore(deps): update NVIDIA EGL external platform"
          - group: nvidia
            element: bluefin-nvidia/nvidia-container-toolkit.bst
            branch: patchraptor/track-nvidia-container-toolkit
            title: "chore(deps): update NVIDIA container toolkit"
          - group: nvidia
            element: bluefin-nvidia/nvidia-egl-wayland.bst
            branch: patchraptor/track-nvidia-egl-wayland
            title: "chore(deps): update NVIDIA EGL Wayland"

          - group: core-junctions
            element: "gnome-build-meta.bst freedesktop-sdk.bst"
            branch: patchraptor/track-core-junctions
            title: "chore(deps): update core junctions"

    steps:
      - name: Should this source run?
        id: gate
        shell: bash
        run: |
          group="${{ github.event.inputs.group || 'all' }}"
          element="${{ github.event.inputs.element || '' }}"
          event="${{ github.event_name }}"
          action="${{ github.event.action }}"

          run=false
          if [ -n "$element" ]; then
            if [ "$element" = "${{ matrix.element }}" ]; then
              run=true
            fi
          elif [ "$event" = "repository_dispatch" ]; then
            if [ -n "${{ matrix.dispatch }}" ] && [ "$action" = "${{ matrix.dispatch }}" ]; then
              run=true
            fi
          elif [ "$group" = "all" ] || [ "$group" = "${{ matrix.group }}" ]; then
            run=true
          fi

          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Checkout repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ env.BASE_BRANCH }}
          fetch-depth: 0

      - name: Setup Just
        if: steps.gate.outputs.run == 'true'
        uses: taiki-e/install-action@4684b8405694ae9dd42c9f39ba901a70ae83f4a3 # v2
        with:
          tool: just

      - name: Check bst2 image pin consistency
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          just_sha="$(grep -oE 'bst2:[a-f0-9]{40}' Justfile | cut -d: -f2)"
          track_sha="${BST2_IMAGE##*:}"
          [[ -n "$just_sha" ]] || { echo "ERROR: could not find bst2 SHA in Justfile"; exit 1; }
          [[ "$just_sha" == "$track_sha" ]] || { echo "ERROR: bst2 pin drift: Justfile=$just_sha workflow=$track_sha"; exit 1; }
          echo "OK: bst2 pins consistent: $just_sha"

      - name: Pull BuildStream container image
        if: steps.gate.outputs.run == 'true'
        run: podman pull "$BST2_IMAGE"

      - name: Track sources with BuildStream
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          for element in ${{ matrix.element }}; do
            just bst --no-interactive source track "$element"
          done

      - name: Check for changes
        if: steps.gate.outputs.run == 'true'
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- elements/; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No source updates for ${{ matrix.element }}"
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- elements/
          fi

      - name: Create or update PR
        if: steps.gate.outputs.run == 'true' && steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          branch="${{ matrix.branch }}"
          title="${{ matrix.title }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B "$branch"
          git add elements/
          git commit -m "$title"
          git push --force-with-lease origin "$branch"

          {
            echo "## BuildStream source update"
            echo ""
            echo "| | |"
            echo "| --- | --- |"
            echo "| **Elements** | \`${{ matrix.element }}\` |"
            echo "| **Base** | \`${BASE_BRANCH}\` |"
            echo "| **Branch** | \`${branch}\` |"
            echo ""
            echo "---"
            echo "Generated by [Track BuildStream Sources](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          } > /tmp/pr-body.md

          existing="$(gh pr list --base "$BASE_BRANCH" --head "$branch" --json number --jq '.[0].number' 2>/dev/null || true)"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body-file /tmp/pr-body.md
            gh pr view "$existing" --json url --jq '.url'
          else
            gh pr create --base "$BASE_BRANCH" --head "$branch" --title "$title" --body-file /tmp/pr-body.md
          fi
