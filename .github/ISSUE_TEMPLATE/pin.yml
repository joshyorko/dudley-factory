name: Pin Request
description: Ask to pin a package to a specific version in order to avoid regressions
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to fill out this request. Dudley Factory can pin BuildStream sources or defer selected payload until an upstream regression is resolved.
  - type: textarea
    id: package
    attributes:
      label: Describe the Package
      description: Describe the package you want pinned and why
      placeholder: Pin foobar to version 1.2
      value: "Package foobar version 1.2 blew up, we need to revert to 1.1"
    validations:
      required: true
  - type: textarea
    id: bodhi
    attributes:
      label: Bodhi Link (Optional)
      description: Add the upstream release, checksum, commit, or Bodhi link to the working version when available.
      placeholder: Upstream release, checksum, commit, or Bodhi link
      value: "Pin to this version please: https://example.com/project/releases/tag/v1.1"
    validations:
      required: false
